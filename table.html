<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daftar Mahasiswa</title>

    <style>
        table {
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
            width: 600px;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 12px;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover {
            background-color: #555;
            color: white;
        }

        thead th {
            background-color: #08752b;
            color: white;
            text-align: center;
        }

        tr:nth-child(odd) {
            background-color: #e7e7e7;
        }

        caption {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <button type="submit">submit</button>

    <table>
        <caption>daftar mahasiswa</caption>

        <thead>
            <tr>
                <th rowspan="2">NO</th>
                <th rowspan="2">NIM</th>
                <th colspan="2">MAHASISWA</th>
            </tr>
            <tr>
                <th>NAMA</th>
                <th>PRODI</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>2402011023</td>
                <td>junindra bagus</td>
                <td>mentok glory</td>
            </tr>
            <tr>
                <td>2</td>
                <td>2402011024</td>
                <td>reno aja</td>
                <td>imortal 100</td>
            </tr>
            <tr>
                <td>3</td>
                <td>2402011027</td>
                <td>reno ganteng</td>
                <td>peresiden</td>
            </tr>
            <tr>
                <td colspan="4">jumlah</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
