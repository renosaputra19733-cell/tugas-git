<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Mata Kuliah</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #333366;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #e0e0e0;
        }

        tr:nth-child(odd) {
            background-color: white;
        }

        tr:hover {
            background-color: #87cefa;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>DAFTAR MATA KULIAH</h2>

    <table>
        <tr>
            <th>No</th>
            <th>Kode Mata Kuliah</th>
            <th>Nama Mata Kuliah</th>
            <th>Jumlah SKS</th>
            <th>Semester</th>
        </tr>

        <tr>
            <td>1</td>
            <td>IF101</td>
            <td>Pemrograman Internet</td>
            <td>3</td>
            <td>5</td>
        </tr>

        <tr>
            <td>2</td>
            <td>IF102</td>
            <td>Pemrograman Python</td>
            <td>3</td>
            <td>5</td>
        </tr>

        <tr>
            <td>3</td>
            <td>IF103</td>
            <td>Basis Data</td>
            <td>3</td>
            <td>5</td>
        </tr>

        <tr>
            <td>4</td>
            <td>IF104</td>
            <td>Jaringan Komputer</td>
            <td>2</td>
            <td>5</td>
        </tr>
    </table>

</body>
</html>
